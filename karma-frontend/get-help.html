<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Help | Karma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container section" id="main-content">
      <p class="kicker">Get help</p>
      <h1>We’re ready to listen.</h1>
      <div class="page-shell">
        <form class="panel form-grid">
          <div class="field"><label>Your name</label><input class="input" type="text" /></div>
          <div class="field"><label>Email</label><input class="input" type="email" /></div>
          <div class="field"><label>What do you need help with?</label><textarea class="textarea" rows="6"></textarea></div>
          <button class="btn btn-primary" type="submit">Request support</button>
        </form>
        <aside class="panel">
          <h3>What happens next</h3>
          <p class="muted">We review each request for clarity and then connect with the right people or campaign opportunities.</p>
        </aside>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
