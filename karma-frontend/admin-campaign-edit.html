<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Edit campaign | Karma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container section" id="main-content">
      <p class="kicker">Campaign editor</p>
      <h1>Create or update a campaign</h1>
      <div class="panel">
        <form class="form-grid">
          <div class="field"><label>Title</label><input class="input" type="text" /></div>
          <div class="field"><label>Summary</label><textarea class="textarea" rows="4"></textarea></div>
          <div class="field"><label>Goal in KES</label><input class="input" type="number" /></div>
        </form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
