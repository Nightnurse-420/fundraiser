<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Karma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container section" id="main-content">
      <p class="kicker">Contact</p>
      <h1>Talk to us.</h1>
      <div class="page-shell">
        <form class="panel form-grid">
          <div class="field"><label>Name</label><input class="input" type="text" placeholder="Your name" /></div>
          <div class="field"><label>Email</label><input class="input" type="email" placeholder="you@example.com" /></div>
          <div class="field"><label>Subject</label><input class="input" type="text" placeholder="How can we help?" /></div>
          <div class="field"><label>Message</label><textarea class="textarea" rows="6" placeholder="Tell us what you need."></textarea></div>
          <button class="btn btn-primary" type="submit">Send message</button>
        </form>
        <aside class="panel">
          <h3>Support</h3>
          <p class="muted">hello@karma.co.ke</p>
          <p class="muted">+254 700 000 000</p>
          <p class="muted">Nairobi, Kenya</p>
        </aside>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
