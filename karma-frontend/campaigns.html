<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse active campaigns, communities and causes supported by Karma." />
    <title>Campaigns | Karma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="main-content" data-page="campaigns">
      <header class="page-header">
        <div class="container">
          <p class="kicker">Browse causes</p>
          <h1>Find the right place to make change.</h1>
        </div>
      </header>
      <section class="section" style="padding-top:0;">
        <div class="container">
          <div class="panel">
            <div class="filters">
              <div class="filter-group" style="flex:1; min-width:220px;">
                <label for="searchInput">Search</label>
                <input id="searchInput" class="input" type="search" placeholder="Search campaigns or location" />
              </div>
              <div class="filter-group">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter" class="select"><option value="">All sectors</option></select>
              </div>
              <div class="filter-group">
                <label for="sortSelect">Sort</label>
                <select id="sortSelect" class="select">
                  <option value="newest">Newest</option>
                  <option value="most_funded">Most funded</option>
                  <option value="ending_soon">Ending soon</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="section" style="padding-top:0;">
        <div class="container">
          <div id="campaignGrid" class="card-grid" aria-live="polite"></div>
          <div id="campaignEmpty" class="empty-state hidden">No campaigns match your filters right now.</div>
          <div id="campaignError" class="error-state hidden">We could not load campaigns. Please try again.</div>
          <div id="pagination" style="display:flex; justify-content:center; gap:0.75rem; margin-top:1.5rem; flex-wrap:wrap;"></div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
    <script src="campaigns.js"></script>
  </body>
</html>
