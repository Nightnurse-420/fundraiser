<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://localhost:4000 https://*.example.com;" />
    <title>Admin login | Karma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container section" id="main-content" data-page="admin-login">
      <div class="page-shell">
        <div class="panel">
          <p class="kicker">Staff access</p>
          <h1>Welcome back.</h1>
          <form id="adminLoginForm" class="form-grid">
            <div class="field"><label for="admin-email">Email</label><input id="admin-email" class="input" type="email" /></div>
            <div class="field"><label for="admin-password">Password</label><input id="admin-password" class="input" type="password" /></div>
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
    <script src="admin-login.js"></script>
  </body>
</html>
