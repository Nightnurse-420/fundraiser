<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Categories | Karma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container section" id="main-content">
      <p class="kicker">Categories</p>
      <h1>Manage categories</h1>
      <div class="panel">
        <form class="form-grid">
          <div class="field"><label>Name</label><input class="input" type="text" /></div>
          <div class="field"><label>Description</label><textarea class="textarea"></textarea></div>
          <button class="btn btn-primary" type="submit">Save category</button>
        </form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
