services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: karma
      POSTGRES_PASSWORD: karma
      POSTGRES_DB: karma
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karma"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://karma:karma@db:5432/karma
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
